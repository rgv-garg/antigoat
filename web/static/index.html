<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahayak memory X-ray</title>
<meta name="description" content="Sahayak, an Aadhaar help assistant, with AntiGOAT's Memory X-ray: see every place a 'deleted' detail is still stored.">
<link rel="icon" href="/static/goat.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,300..800&family=Anek+Latin:wdth,wght@75..125,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="sahayak">
<header class="bar">
  <a class="brand" href="/" aria-label="Sahayak home">
    <img src="/static/goat.jpeg" alt="" width="34" height="34">
    <span class="name">Sahayak</span>
    <span class="tested">audited by AntiGOAT</span>
  </a>
  <div class="controls">
    <div class="ctl">
      <span class="ctl-label" id="lbl-backend">Memory</span>
      <div class="seg" id="backend" role="group" aria-labelledby="lbl-backend">
        <button type="button" data-b="ours" aria-pressed="true">Sahayak store</button>
        <button type="button" data-b="mem0" aria-pressed="false">Mem0 2.2.1</button>
      </div>
    </div>
    <div class="ctl">
      <span class="ctl-label" id="lbl-checks">Memory Checks</span>
      <div class="seg checks" id="checks" role="group" aria-labelledby="lbl-checks">
        <button type="button" data-m="off" aria-pressed="true">Off</button>
        <button type="button" data-m="v2" aria-pressed="false">v2</button>
        <button type="button" data-m="on" aria-pressed="false">On</button>
        <button type="button" data-m="paranoid" aria-pressed="false">Strict</button>
      </div>
    </div>
  </div>
  <a class="navlink" href="/report">Audit findings</a>
</header>
<p class="modeline" id="modeline"></p>

<main class="split">
  <!-- what the citizen sees -->
  <section class="citizen" aria-label="Citizen chat with Sahayak">
    <div class="account">
      <label>Citizen <input id="user" value="ramesh" autocomplete="off" spellcheck="false"></label>
      <label>Pincode <input id="pin" value="560012" inputmode="numeric" autocomplete="off"></label>
      <button type="button" class="quiet" id="btnEnd" title="Ends the visit: chat context is cleared and Sahayak writes its summary">End visit</button>
      <button type="button" class="quiet" id="btnReset" title="New Sahayak with empty memory">Start over</button>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>

    <div class="scenes" id="scenes" aria-label="Demo shortcuts">
      <button type="button" data-scene="story">Tell Teja's story</button>
      <button type="button" data-scene="forget">“Please forget my name”</button>
      <button type="button" data-scene="fight">Next visit: who fought?</button>
      <button type="button" data-scene="all">Next visit: summarise</button>
      <button type="button" data-scene="hindi">नंबर भूल जाओ</button>
      <button type="button" data-scene="poison">Fake notice, then apply</button>
      <button type="button" data-scene="suresh">Log in as Suresh</button>
    </div>

    <div class="composer">
      <div class="agents" role="group" aria-label="Which Sahayak agent">
        <button type="button" data-a="intake" aria-pressed="true">Intake</button>
        <button type="button" data-a="grievance" aria-pressed="false">Grievance</button>
        <span class="agent-hint" id="agenthint"></span>
      </div>
      <div class="inputrow">
        <button type="button" class="mic" id="mic" aria-label="Speak (Sarvam voice)" title="Speak in any Indian language">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <textarea id="box" rows="1" placeholder="Type in English, Hindi or Hinglish"></textarea>
        <button type="button" class="send" id="send">Send</button>
      </div>
    </div>
  </section>

  <!-- what Sahayak actually keeps -->
  <section class="film" aria-label="Memory X-ray">
    <div class="film-head">
      <div>
        <h1 id="xtitle">Memory X-ray</h1>
        <p id="xsub" class="xsub">Ask Sahayak to forget something, or scan any value, to see every place it is stored.</p>
      </div>
      <form id="xform" class="xform" autocomplete="off">
        <label class="sr" for="xq">Value to scan</label>
        <input id="xq" placeholder="Scan a value, e.g. teja">
        <button type="submit">Scan</button>
      </form>
    </div>

    <div id="xray" class="xray"></div>
    <div id="receipt"></div>
    <div id="verify"></div>

    <details class="stored" id="storedwrap" open>
      <summary>Stored memories <span id="memcount" class="count"></span></summary>
      <ol id="mem" class="mem"></ol>
    </details>
    <details class="governance" id="govwrap">
      <summary>Memory Checks &mdash; governance</summary>
      <div class="govbtns" id="govbtns">
        <button type="button" data-view="provenance" title="Origin and trust rank of every stored memory">Provenance</button>
        <button type="button" data-view="contradictions" title="Topics where memory holds two conflicting values">Contradictions</button>
        <button type="button" data-view="why" title="Leave-one-out: which memory caused the current decision?">Why approved?</button>
        <button type="button" data-view="rollback" title="Quarantine the memory that caused a bad decision, and flip it back">Roll back</button>
      </div>
      <div id="gov" class="gov"></div>
    </details>
    <details class="activity" id="feedwrap">
      <summary>Memory Checks activity</summary>
      <ol id="feed" class="feed"></ol>
    </details>
    <p class="model" id="model"></p>
  </section>
</main>

<audio id="player" hidden></audio>
<script src="/static/app.js?v=voice2"></script>
</body>
</html>
